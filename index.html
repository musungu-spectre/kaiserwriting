<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: filesystem: file: https:; img-src 'self' data: blob: filesystem: file: https:; media-src 'self' data: blob: filesystem: file: https:; font-src 'self' data: https:; connect-src 'self' data: blob: filesystem: file: https:;">
<title>K@isers Writing — Books, Poems &amp; Podcast by Chanda Kaiser Mwelwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F3EFE6;
    --plum:#241C10;
    --gold:#D9A94A;
    --rust:#A8492E;
    --cream:#151417;
    --sand:#26272B;
    --white:#1F2024;
    --line: rgba(243,239,230,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1.1;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px;}
  ::selection{background:var(--gold);color:var(--cream);}

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:2px;
  }

  /* NAV */
  .nav{position:sticky; top:0; z-index:40; background:var(--cream); border-bottom:2px solid var(--gold);}
  .nav-inner{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces';font-weight:600;font-size:21px;color:var(--gold);}
  .logo em{font-style:italic;font-weight:500;}
  .logo-mark{width:28px;height:28px;flex-shrink:0;}
  .nav-links{display:flex;align-items:center;gap:26px;font-size:15px;font-weight:500;}
  .nav-links a{padding:6px 2px;border-bottom:2px solid transparent;}
  .nav-links a.active{border-bottom-color:var(--rust);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:2px solid var(--ink);border-radius:3px;font-weight:600;font-size:15px;background:var(--white);color:var(--ink);transition:transform .12s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--gold);border-color:var(--ink);color:var(--cream);}
  .btn-dark{background:var(--plum);color:var(--ink);border-color:var(--gold);}
  .btn-ghost{background:transparent;border-color:transparent;padding:11px 8px;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 14px;font-size:13px;}

  /* HERO */
  .hero{padding:60px 0 52px;border-bottom:2px solid var(--ink);}
  .hero-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:52px;align-items:center;}
  .eyebrow-tag{display:inline-flex;align-items:center;gap:8px;background:var(--sand);border:2px solid var(--ink);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:22px;font-family:'Work Sans';}
  .eyebrow-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--rust);}
  .hero h1{font-size:46px;max-width:560px;}
  .hero-underline{position:relative;white-space:nowrap;}
  .hero-underline svg{position:absolute;left:0;bottom:-8px;width:100%;height:12px;}
  .hero p.lede{font-size:18px;max-width:460px;margin:22px 0 30px;color:#D8D0C0;}
  .hero-ctas{display:flex;gap:14px;flex-wrap:wrap;}
  .format-row{margin-top:26px;font-size:13px;color:#A79C8A;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .format-pill{border:1.5px solid var(--line);border-radius:20px;padding:4px 11px;font-weight:600;}

  .book-mock{background:var(--plum); border:2px solid var(--ink); border-radius:18px; padding:20px; position:relative; max-width:330px; margin-left:auto; box-shadow:8px 8px 0 var(--ink);}
  .book-card{background:var(--white);border-radius:10px;padding:20px;}
  .book-card .tag{display:inline-block;background:var(--sand);border:1.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-size:11px;font-weight:600;margin-bottom:12px;}
  .book-card h3{font-size:20px;margin-bottom:8px;}
  .book-card p{font-size:13px;color:#C9C0AE;margin:0 0 14px;}
  .book-price{font-family:'Fraunces';font-size:26px;font-weight:600;color:var(--gold);}
  .book-price span{font-size:13px;color:#A89C89;font-weight:500;font-family:'Work Sans';}
  .book-mock .buy-fake{margin-top:14px;background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:12px;text-align:center;font-weight:700;color:var(--cream);}
  .free-mark{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;}

  /* SECTIONS */
  section{padding:54px 0;border-bottom:2px solid var(--ink);}
  section:last-of-type{border-bottom:none;}
  .section-head{max-width:560px;margin-bottom:32px;}
  .section-head h2{font-size:30px;}
  .section-head p{color:#C9C0AE;margin-top:10px;font-size:16px;}

  /* Featured book */
  .feature-grid{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:center;}
  .feature-cover{width:220px;height:280px;background:linear-gradient(160deg, var(--plum), var(--cream));border:2px solid var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Fraunces';text-align:center;padding:24px;font-size:19px;font-weight:600;box-shadow:6px 6px 0 var(--gold);overflow:hidden;}
  .feature-cover img{width:100%;height:100%;object-fit:cover;}
  .feature-text h3{font-size:26px;margin-bottom:12px;}
  .feature-text p{font-size:15.5px;color:#D8D0C0;max-width:520px;margin:0 0 18px;}

  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:28px;flex-wrap:wrap;}
  .tab{padding:11px 18px;font-weight:600;font-size:14.5px;border:2px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;margin-bottom:-2px;color:#A79C8A;background:transparent;}
  .tab.active{background:var(--white);border-color:var(--ink);color:var(--ink);}

  .market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .prod-card-wrap{position:relative;}
  .prod-card-block{position:absolute;inset:8px -8px -8px 8px;background:var(--sand);border:2px solid var(--ink);border-radius:8px;}
  .prod-card{position:relative;background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;height:100%;}
  .prod-cover{width:100%;height:170px;border-radius:5px;object-fit:cover;border:1px solid var(--line);background:linear-gradient(160deg,var(--plum),var(--cream));}
  .mini-gallery{display:flex;gap:6px;overflow:hidden;}
  .mini-gallery img{width:42px;height:42px;object-fit:cover;border:1px solid var(--gold);border-radius:4px;}
  .upcoming-image{width:100%;height:150px;border-radius:6px;object-fit:cover;border:1px solid var(--line);margin-bottom:2px;}
  .prod-type{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:0.02em;background:var(--plum);color:var(--gold);border:1px solid var(--gold);padding:4px 10px;border-radius:12px;}
  .prod-card h3{font-size:18px;font-family:'Fraunces';font-weight:600;}
  .prod-card p{font-size:13.5px;color:#C9C0AE;margin:0;flex-grow:1;}
  .prod-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .prod-price{font-family:'Fraunces';font-weight:600;font-size:18px;}
  .empty-state{border:2px dashed var(--line);border-radius:8px;padding:40px;text-align:center;color:#A79C8A;}
  .free-zone{background:linear-gradient(135deg,#20221e 0%,#151417 58%,#2d2420 100%);overflow:hidden;}
  .free-zone .section-head{position:relative;z-index:1;}
  .free-zone .section-head h2{font-size:38px;color:var(--gold);}
  .free-zone .section-head p{color:#E2D7C3;}
  .free-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .free-card{position:relative;min-height:220px;background:rgba(31,32,36,.9);border:2px solid var(--gold);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:8px 8px 0 rgba(168,73,46,.55);overflow:hidden;}
  .free-card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 22%,rgba(255,255,255,.12) 42%,transparent 58%);transform:translateX(-120%);animation:cardSheen 5.5s ease-in-out infinite;pointer-events:none;}
  .free-card::after{content:"";position:absolute;width:130px;height:130px;border:1px solid rgba(217,169,74,.35);border-radius:50%;right:-48px;bottom:-54px;box-shadow:0 0 0 14px rgba(217,169,74,.06),0 0 0 28px rgba(217,169,74,.04);}
  .free-card h3{font-size:22px;max-width:260px;}
  .free-card p{font-size:14px;color:#D8D0C0;flex-grow:1;margin:0;max-width:290px;}
  .free-card .btn{align-self:flex-start;position:relative;z-index:1;}
  .free-card:nth-child(2){animation-delay:.12s;}
  .free-card:nth-child(3){animation-delay:.24s;}

  /* FORMS */
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field .hint{font-weight:400;color:#9C917F;font-size:12px;display:block;margin-top:4px;}
  .field input, .field textarea, .field select{width:100%;padding:11px 12px;border:2px solid var(--ink);border-radius:4px;font-family:inherit;font-size:15px;background:var(--white);color:var(--ink);}
  .field textarea{resize:vertical;min-height:88px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:26px;}

  .dash-product-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1.5px solid var(--line);}
  .dash-product-row:last-child{border-bottom:none;}
  .dash-thumb{width:52px;height:52px;border-radius:8px;background:var(--sand);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .dash-info{flex-grow:1;min-width:0;}
  .dash-info h4{font-size:15.5px;margin:0 0 3px;font-family:'Fraunces';font-weight:600;}
  .dash-info .meta{font-size:12.5px;color:#9C917F;}
  .link-copy{display:flex;align-items:center;gap:8px;}
  .link-copy input{flex-grow:1;background:var(--sand);font-size:12.5px;padding:8px 10px;border:1.5px solid var(--line);border-radius:4px;}
  .picture-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .picture-item{position:relative;width:92px;height:92px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sand);}
  .picture-item img{width:100%;height:100%;object-fit:cover;}
  .picture-item button{position:absolute;top:3px;right:3px;width:24px;height:24px;border:1px solid var(--ink);border-radius:50%;background:var(--rust);color:var(--ink);font-weight:700;line-height:1;}

  .alert{padding:12px 16px;border-radius:6px;font-size:14px;margin-bottom:18px;border:2px solid var(--ink);}
  .alert-good{background:#E3ECD9;color:#1B2B1B;}
  .alert-info{background:var(--sand);}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px;}
  .stat-card{background:var(--sand);border:2px solid var(--ink);border-radius:8px;padding:18px;}
  .stat-card strong{display:block;font-family:'Fraunces';font-size:30px;color:var(--gold);line-height:1;margin-bottom:8px;}
  .stat-card span{font-size:12px;color:#C9C0AE;}

  /* PRODUCT PAGE */
  .prod-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;align-items:start;padding:48px 0;}
  .creator-chip{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .product-cover-large{width:min(300px,100%);aspect-ratio:3/4;object-fit:cover;border:2px solid var(--gold);border-radius:8px;box-shadow:6px 6px 0 var(--gold);}
  .buy-box{background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:24px;box-shadow:6px 6px 0 var(--ink);position:sticky;top:90px;}
  .buy-box .big-price{font-family:'Fraunces';font-size:32px;font-weight:600;margin-bottom:4px;}
  .buy-box .curr-note{font-size:12.5px;color:#9C917F;margin-bottom:18px;}
  .delivers-list{list-style:none;padding:0;margin:18px 0 0;font-size:13.5px;color:#D8D0C0;}
  .delivers-list li{padding:6px 0;display:flex;gap:8px;align-items:flex-start;}

  /* MODAL */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--white);border:2px solid var(--ink);border-radius:10px;max-width:420px;width:100%;padding:28px;box-shadow:8px 8px 0 var(--ink);}
  .modal h3{font-size:20px;margin-bottom:6px;}
  .net-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .net-opt{border:2px solid var(--ink);border-radius:6px;padding:12px;text-align:center;font-size:13.5px;font-weight:600;background:var(--white);}
  .net-opt.selected{background:var(--gold);color:var(--cream);}
  .success-icon{width:52px;height:52px;margin:0 auto 14px;}

  /* ABOUT */
  .about-grid{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start;}
  .about-avatar{width:180px;height:180px;border-radius:50%;background:var(--gold);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden;}
  .about-avatar img{width:100%;height:100%;object-fit:cover;}
  .about-body p{font-size:16px;color:#DDD5C5;margin:0 0 16px;max-width:560px;}
  .social-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .social-row a{border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;}

  footer{padding:36px 0;}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13.5px;color:#A79C8A;}

  @media (max-width:820px){
    .hero-grid, .prod-hero, .about-grid, .feature-grid{grid-template-columns:1fr;}
    .hero h1{font-size:34px;}
    .market-grid{grid-template-columns:1fr;}
    .free-grid{grid-template-columns:1fr;}
    .upcoming-grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .stats-grid{grid-template-columns:1fr;}
    .book-mock{margin:0 auto;}
    .buy-box{position:static;}
    .about-avatar, .feature-cover{margin:0 auto;}
  }

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalPop{ from{ opacity:0; transform:scale(0.94) translateY(6px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  @keyframes floatY{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  @keyframes drawUnderline{ from{ stroke-dashoffset:240; } to{ stroke-dashoffset:0; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes popIn{ from{ opacity:0; transform:scale(0.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes cardLift{ from{ opacity:0; transform:translateY(24px) rotate(1deg); } to{ opacity:1; transform:translateY(0) rotate(0); } }
  @keyframes cardSheen{ 0%,55%{ transform:translateX(-120%); } 78%,100%{ transform:translateX(120%); } }

  .page-enter{ animation:fadeInUp 0.45s ease both; }
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible{ opacity:1; transform:translateY(0); }

  .nav{ transition:box-shadow 0.25s ease, border-color 0.25s ease; }
  .nav.scrolled{ box-shadow:0 4px 0 var(--gold); }
  .logo-mark{ transition:transform 0.3s ease; }
  .logo:hover .logo-mark{ transform:rotate(-6deg) scale(1.08); }

  .btn{ transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease; }
  .btn:hover{ transform:translateY(-2px); box-shadow:3px 4px 0 var(--gold); }
  .btn-primary:hover{ box-shadow:3px 4px 0 var(--ink); }
  .btn:active{ transform:translateY(1px); box-shadow:none; }

  .tab{ transition:color 0.2s ease, background 0.2s ease; }
  .eyebrow-tag{ animation:fadeInUp 0.5s ease both; }
  .eyebrow-tag .dot{ animation:floatY 2.4s ease-in-out infinite; display:inline-block; }

  .hero-underline path{ stroke-dasharray:240; stroke-dashoffset:240; animation:drawUnderline 1s ease 0.3s forwards; }

  .book-mock{ animation:floatY 5s ease-in-out infinite; transition:transform 0.3s ease; }
  .book-mock:hover{ transform:scale(1.02); }

  .prod-card-wrap{ transition:transform 0.25s ease; }
  .prod-card-wrap:hover{ transform:translateY(-5px); }
  .prod-card-wrap:hover .prod-card-block{ inset:11px -11px -11px 11px; transition:inset 0.25s ease; }
  .prod-card-block{ transition:inset 0.25s ease; }
  .prod-card{ transition:box-shadow 0.25s ease; }
  .prod-card-wrap:hover .prod-card{ box-shadow:2px 2px 0 var(--gold); }
  .free-card.reveal.visible{ animation:cardLift .65s cubic-bezier(.2,.8,.3,1) both; }
  .free-card:hover{ transform:translateY(-6px) rotate(-.5deg); transition:transform .25s ease, box-shadow .25s ease; box-shadow:10px 12px 0 rgba(168,73,46,.6); }
  .upcoming-zone{background:linear-gradient(135deg,#2A211B 0%,#151417 62%,#22252A 100%);}
  .upcoming-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .upcoming-card{background:rgba(31,32,36,.82);border:2px dashed var(--rust);border-radius:10px;padding:22px;min-height:190px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 rgba(217,169,74,.22);}
  .upcoming-card h3{font-size:21px;color:#F3EFE6;}
  .upcoming-card p{font-size:14px;color:#C9C0AE;flex-grow:1;margin:0;}
  .coming-label{align-self:flex-start;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}

  .feature-cover{ transition:transform 0.3s ease; }
  .feature-grid:hover .feature-cover{ transform:rotate(-1.5deg) scale(1.03); }

  .about-avatar, .avatar{ transition:transform 0.3s ease; }
  .about-avatar:hover{ transform:scale(1.04) rotate(-1deg); }

  .modal-backdrop{ animation:fadeIn 0.2s ease both; }
  .modal{ animation:modalPop 0.28s cubic-bezier(.2,.8,.3,1.2) both; }
  .success-icon{ animation:popIn 0.4s cubic-bezier(.2,.8,.3,1.4) both; }
  .net-opt{ transition:transform 0.15s ease, background 0.15s ease; }
  .net-opt:hover{ transform:translateY(-2px); }
  .net-opt.selected{ animation:popIn 0.25s ease both; }

  .field input, .field textarea, .field select{ transition:border-color 0.2s ease, box-shadow 0.2s ease; }
  .field input:focus, .field textarea:focus, .field select:focus{ box-shadow:2px 2px 0 var(--gold); }

  .spinner{ display:inline-block; width:16px; height:16px; border:2px solid var(--gold); border-top-color:transparent; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:-3px; margin-right:6px; }

  /* CHAT ASSISTANT */
  .chat-launcher{position:fixed;right:22px;bottom:22px;z-index:80;width:58px;height:58px;border:2px solid var(--ink);border-radius:50%;background:var(--gold);color:var(--cream);box-shadow:4px 5px 0 var(--rust);font-size:24px;transition:transform .2s ease,box-shadow .2s ease;}
  .chat-launcher:hover{transform:translateY(-3px) rotate(-4deg);box-shadow:5px 8px 0 var(--rust);}
  .chat-panel{position:fixed;right:22px;bottom:92px;z-index:80;width:min(380px,calc(100vw - 32px));height:min(570px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--white);border:2px solid var(--ink);border-radius:12px;box-shadow:9px 10px 0 var(--rust);overflow:hidden;animation:modalPop .25s ease both;}
  .chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--plum);border-bottom:2px solid var(--gold);}
  .chat-head strong{font-family:'Fraunces';font-size:18px;color:var(--gold);}
  .chat-head small{display:block;color:#D8D0C0;font-size:11px;margin-top:2px;}
  .chat-close{border:0;background:transparent;color:var(--ink);font-size:24px;line-height:1;padding:2px 6px;}
  .chat-log{flex:1;overflow-y:auto;padding:16px;background:linear-gradient(160deg,#1F2024,#17181B);}
  .chat-msg{max-width:86%;padding:10px 12px;margin:0 0 12px;border-radius:10px;font-size:13.5px;white-space:pre-line;}

<script>
/* ---------- storage helpers ---------- */
function getBrowserStorage(){
  if (window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function') {
    return window.storage;
  }
  return {
    async get(key){
      try { const raw = localStorage.getItem(key); return raw ? { value: raw } : null; }
      catch (e) { return null; }
    },
    async set(key, value){
      try { localStorage.setItem(key, value); return true; }
      catch (e) { console.warn('localStorage unavailable:', e.message); return false; }
    }
  };
}

async function storeGet(key, shared){
  const storage = getBrowserStorage();
  try {
    const r = await storage.get(key, !!shared);
    if (!r) return null;
    if (typeof r.value !== 'undefined') return JSON.parse(r.value);
    return JSON.parse(r);
  } catch (e) { return null; }
}
async function storeSet(key, value, shared){
  const storage = getBrowserStorage();
  try {
    const payload = JSON.stringify(value);
    const ok = await storage.set(key, payload, !!shared);
    return !!ok;
  } catch (e) {
    console.error('storage set failed', e);
    return false;
  }
}

/* ---------- backend connection ----------
   Leave API_BASE empty to keep running in demo mode (simulated payments,
   PIN-only dashboard, no real emails — everything stored in this browser).
   Once you deploy the companion backend (see /kaisier-backend in your
   downloads) and know its live URL, paste it below, e.g.:
   const API_BASE = "https://kaisier-backend.onrender.com";
   The site will then use real Flutterwave payments, real login, real
   file delivery, and real subscriber emails automatically. */
const API_BASE = "https://kaisier-writings-3.onrender.com";
async function apiCall(path, method, body, token){
  const headers = { 'Content-Type': 'application/json' };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, {
    method: method || 'GET',
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ throw new Error((data && data.error) || ('Request failed: ' + res.status)); }
  return data;
}
const isLive = () => !!API_BASE;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(amount, currency){ const n = Number(amount); return currency + " " + n.toLocaleString(undefined,{maximumFractionDigits:0}); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function resolveLocalAssetUrl(value){
  if (!value) return '';
  const raw = String(value).trim().replace(/\\/g, '/');
  if (!raw) return '';
  if (/^(https?:|blob:|data:|mailto:|tel:)/i.test(raw)) return raw;
  if (/^file:\/\//i.test(raw)) return encodeURI(raw);
  if (/^[A-Za-z]:\//.test(raw)) return 'file:///' + raw.replace(/^([A-Za-z]:)\//, '$1/');
  if (raw.startsWith('/')) return 'file://' + raw;
  return encodeURI(raw);
}
function coverMarkup(product, className){
  const imageUrl = resolveLocalAssetUrl(product.coverImage);
  return product.coverImage
    ? `<img class="${className}" src="${escapeHtml(imageUrl)}" alt="Cover of ${escapeHtml(product.title)}">`
    : `<div class="${className}">${escapeHtml(product.title)}</div>`;
}
function productPicture(product){ return (product.galleryImages && product.galleryImages[0]) || product.coverImage || null; }
function miniGallery(product){
  const pictures = product.galleryImages || [];
  return pictures.length > 1 ? `<div class="mini-gallery" aria-label="More pictures">${pictures.slice(1).map((picture, index) => `<img src="${escapeHtml(resolveLocalAssetUrl(picture))}" alt="${escapeHtml(product.title)} picture ${index + 2}">`).join('')}</div>` : '';
}
function inCategory(type, cat){
  if(cat === 'All') return true;
  if(cat === 'Podcast') return type === 'Podcast – Audio' || type === 'Podcast – Video';
  return type === cat;
}
function isFreeProduct(product){ return product.type !== 'Book'; }
function isUpcomingProduct(product){ return product.upcoming === true; }
function isPublicMediaUrl(value){

}
function freeActionLabel(type){

function normalizeProducts(rawProducts){
  const liveProducts = (rawProducts || []).filter(product => product && product.title);
  if (!liveProducts.length) {
    return DEFAULT_PRODUCTS.map(item => ({ ...item }));
  }

  const canonical = DEFAULT_PRODUCTS.map(item => ({ ...item }));
  const canonicalById = new Map(canonical.map(item => [item.id, item]));
  const canonicalByTitle = new Map(canonical.map(item => [item.title.trim().toLowerCase(), item]));
  const seen = new Set();
  const cleaned = [];

  for (const product of liveProducts) {
    if (!product || !product.title) continue;
    const key = (product.id && String(product.id)) || product.title.trim();
    if (seen.has(key)) continue;
    seen.add(key);

    const fallback = canonicalById.get(product.id) || canonicalByTitle.get(String(product.title).trim().toLowerCase());
    const hasExplicitFileLink = Object.prototype.hasOwnProperty.call(product, 'fileLink');
    const hasExplicitCoverImage = Object.prototype.hasOwnProperty.call(product, 'coverImage');
    const hasExplicitGalleryImages = Object.prototype.hasOwnProperty.call(product, 'galleryImages');

    const merged = {
      ...(fallback || {}),
      ...product,
      fileLink: hasExplicitFileLink ? (product.fileLink || null) : ((fallback && fallback.fileLink) || null),
      coverImage: hasExplicitCoverImage ? (product.coverImage || null) : ((fallback && fallback.coverImage) || null),
      galleryImages: hasExplicitGalleryImages
        ? (Array.isArray(product.galleryImages) ? product.galleryImages : [])
        : (fallback && Array.isArray(fallback.galleryImages) ? fallback.galleryImages : [])
    };

    cleaned.push(merged);
  }

  return cleaned;
}

async function registerVisitor(){
  visitorSessionId = await storeGet('visitor-session-id', false);
  if(!visitorSessionId){
    visitorSessionId = uid() + uid();
    await storeSet('visitor-session-id', visitorSessionId, false);
  }
  if(isLive()){
    try{ await apiCall('/analytics/visit', 'POST', { sessionId: visitorSessionId }); }
    catch(err){ console.warn('Visitor tracking unavailable:', err.message); }
    return;
  }
  const sessions = await storeGet('visitor-sessions', true) || [];
  const now = Date.now();
  const existing = sessions.find(session => session.id === visitorSessionId);
  if(existing){ existing.lastSeen = now; existing.visits = (existing.visits || 1) + 1; }
  else sessions.push({ id: visitorSessionId, firstSeen: now, lastSeen: now, visits: 1 });
  await storeSet('visitor-sessions', sessions, true);
  visitorStats = {
    uniqueVisitors: sessions.length,
    totalVisits: sessions.reduce((total, session) => total + (session.visits || 1), 0),
    recentVisitors: sessions.filter(session => session.lastSeen >= now - 7 * 24 * 60 * 60 * 1000).length
  };
}

}

  const password = document.getElementById('login-pw').value;
  try{
    const data = await apiCall('/auth/login', 'POST', { email, password });
    authToken = data.token;
    dashUnlocked = true; pinError = null;
    await storeSet('auth-token', authToken, false);
    try{ subscribers = await apiCall('/subscribers', 'GET', null, authToken); }
    catch(err){ subscribers = []; }
    await loadVisitorStats();
    render();
  } catch(err){
    pinError = err.message || 'Login failed.'; render();
  }
}

async function addProduct(){
  const title = document.getElementById('pf-title').value.trim();
  const description = document.getElementById('pf-desc').value.trim();
  const type = document.getElementById('pf-type').value;
  const currency = document.getElementById('pf-currency').value;
  const price = document.getElementById('pf-price').value;
  const coverFile = document.getElementById('pf-cover-file').files[0];
  const coverUrl = document.getElementById('pf-cover-url').value.trim();
  const existingProduct = editProductId ? products.find(product => product.id === editProductId) : null;
  const bookFile = document.getElementById('pf-file-upload').files[0];
  const enteredFileLink = document.getElementById('pf-file').value.trim();
  const upcoming = document.getElementById('pf-upcoming').checked;
  const notify = document.getElementById('pf-notify') ? document.getElementById('pf-notify').checked : false;
  const numericPrice = Number(price) || 0;
  const statusEl = document.getElementById('pf-file-status');
  let coverImage = coverUrl || (existingProduct && existingProduct.coverImage) || null;
  let fileLink = enteredFileLink || (existingProduct && existingProduct.fileLink) || null;

  if(!title || (type === 'Book' && numericPrice <= 0)){ alert(type === 'Book' ? "Please add a title and a price for this book." : "Please add at least a title."); return; }

  if(isLive() && bookFile){
    try{
      if(statusEl) statusEl.textContent = 'Uploading file…';
      fileLink = await uploadFileToBackend(bookFile);
      if(statusEl) statusEl.textContent = 'File uploaded.';
    } catch(err){ alert('The file could not be uploaded: ' + err.message); if(statusEl) statusEl.textContent = ''; return; }
  }
  if(isLive() && coverFile){
    try{ coverImage = await uploadFileToBackend(coverFile); }
    catch(err){ alert('The cover image could not be uploaded: ' + err.message); return; }
  } else if(coverFile){
    try{ coverImage = await readFileAsDataUrl(coverFile); }
    catch(err){ alert('The cover image could not be read. Please choose another image.'); return; }
  }

  if(isLive() && type !== 'Book' && !isPublicMediaUrl(fileLink)){
    alert('Please upload the audio/video file or paste a public https:// media URL before publishing this free item.');
    return;
  }

  if(isLive()){
    try{
      const saved = await apiCall(editProductId ? '/products/' + editProductId : '/products', editProductId ? 'PATCH' : 'POST', {
        title, description, type, currency, price: numericPrice, coverImage, fileLink, upcoming, notify
      }, authToken);
      if(type !== 'Book' && !isPublicMediaUrl(saved.fileLink) && isPublicMediaUrl(fileLink)){
        saved.fileLink = fileLink;
      }
      if(type !== 'Book' && !isPublicMediaUrl(saved.fileLink)){
        throw new Error('The item was saved without a public media URL. Please upload the file again and retry.');
      }
      products = editProductId ? products.map(product => product.id === editProductId ? saved : product) : products.concat(saved);
    } catch(err){ alert(err.message); return; }
  } else {
    const product = { id: editProductId || uid(), title, description, type, currency, price: numericPrice, coverImage, fileLink, upcoming, creatorName: profile.name, ownerEmail: profile.email };
    products = editProductId ? products.map(existing => existing.id === editProductId ? { ...existing, ...product, id: editProductId } : existing) : products.concat(product);
  }

  products = normalizeProducts(products);
  await persistLocalDashboardState();
  toast = editProductId ? 'saved' : 'added'; editProductId = null; dashTab = 'products'; render();
}
async function uploadFileToBackend(file){
  const form = new FormData();
  form.append('file', file);
  const res = await fetch(API_BASE + '/uploads', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + authToken },
    body: form
  });
  const data = await res.json().catch(() => null);
  if(!res.ok){ throw new Error((data && data.error) || ('Upload failed: ' + res.status)); }
  return data.url;
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Unable to read image.'));
    reader.readAsDataURL(file);
  });
}
async function removeProduct(id){
  const product = products.find(p => p.id === id);
  if(!product){ return; }
  const confirmed = window.confirm(`Remove “${product.title}” from the website? This cannot be undone.`);
  if(!confirmed){ return; }

  if(isLive()){
    try{ await apiCall('/products/' + id, 'DELETE', null, authToken); }
    catch(err){ alert(err.message); return; }
  }
  products = products.filter(p => p.id !== id);
  products = normalizeProducts(products);
  await persistLocalDashboardState();
  if(editProductId === id) editProductId = null;
  render();
}
async function editProduct(id){
  editProductId = id;
  dashTab = 'add';
  if (isLive()) {

      products = products.map(item => item.id === id ? product : item);
    } catch (err) {
      console.warn('Could not load product details for edit:', err.message);
    }
  }
  render();
}

async function addHomepagePicture(){
  const productId = document.getElementById('picture-product').value;
  const file = document.getElementById('picture-file').files[0];
  const url = document.getElementById('picture-url').value.trim();
  if(!file && !url){ alert('Choose a picture or paste an image URL.'); return; }

  let picture = url;
  try {
    if (isLive() && file) {
      picture = await uploadFileToBackend(file);
    } else if (file) {
      picture = await readFileAsDataUrl(file);
    }
  } catch (err) {
    alert('The picture could not be uploaded: ' + err.message);
    return;
  }

  const product = products.find(item => item.id === productId);
  const pictures = product && product.galleryImages ? product.galleryImages.slice() : [];
  if(pictures.length >= 8){ alert('You can add up to 8 pictures per item.'); return; }
  await saveHomepagePictures(productId, pictures.concat(picture));
}
async function removeHomepagePicture(productId, index){
  const product = products.find(item => item.id === productId);
  const pictures = product && product.galleryImages ? product.galleryImages.slice() : [];
  pictures.splice(index, 1);
  await saveHomepagePictures(productId, pictures);
}
async function saveHomepagePictures(productId, pictures){
  if(isLive()){
    try{
      const updated = await apiCall('/products/' + productId + '/pictures', 'PATCH', { pictures }, authToken);
      products = products.map(product => product.id === productId ? updated : product);
    } catch(err){ alert(err.message); return; }

  products = products.map(product => product.id === productId ? { ...product, galleryImages: pictures } : product);
  products = normalizeProducts(products);
  await persistLocalDashboardState();
  dashTab = 'pictures';
  render();
}

function productMediaEmbed(product){
  if (!product || !product.fileLink) return '';
  const href = resolveLocalAssetUrl(product.fileLink);
  const lower = String(href).toLowerCase();
  const mediaId = `product-media-${product.id}`;

  if (/screenpal\.com\/watch|youtube\.com|youtu\.be|vimeo\.com/i.test(lower)) {
    const embedHref = /screenpal\.com\/watch/i.test(href) ? href.replace(/\/watch\//i, '/player/') : href;
    return `
      <div id="${escapeHtml(mediaId)}" data-open-url="${escapeHtml(embedHref)}" style="margin-top:28px; background:rgba(36,28,16,0.7); border:2px solid var(--gold); border-radius:12px; padding:10px;">
        <iframe src="${escapeHtml(embedHref)}" title="${escapeHtml(product.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%; aspect-ratio:16/9; border:0; border-radius:8px; background:#000;"></iframe>
        <a class="btn btn-primary btn-block" href="${escapeHtml(embedHref)}" target="_blank" rel="noopener" style="margin-top:10px;">Open player on phone</a>
      </div>`;
  }

  if (/\.(mp3|wav|m4a|aac|ogg|flac)(\?.*)?$/i.test(lower) || /audio/i.test(product.type) || /audio/i.test(lower)) {
    return `
      <div id="${escapeHtml(mediaId)}" style="margin-top:28px; background:rgba(36,28,16,0.7); border:2px solid var(--gold); border-radius:12px; padding:18px;">
        <audio controls preload="metadata" src="${escapeHtml(href)}" style="width:100%; min-height:48px; background:#000; border-radius:8px;"></audio>
      </div>`;
  }

  if (/\.(mp4|webm|mov|m4v|avi)(\?.*)?$/i.test(lower) || /video/i.test(product.type) || /video/i.test(lower)) {
    return `
      <div id="${escapeHtml(mediaId)}" style="margin-top:28px; background:rgba(36,28,16,0.7); border:2px solid var(--gold); border-radius:12px; padding:18px;">
        <video controls preload="metadata" playsinline src="${escapeHtml(href)}" style="width:100%; max-height:520px; background:#000; border-radius:8px;"></video>
      </div>`;
  }

  if (/\.pdf(\?.*)?$/i.test(lower) || /application\/pdf|pdf/i.test(lower)) {
    return `
      <div id="${escapeHtml(mediaId)}" style="margin-top:28px; background:rgba(36,28,16,0.7); border:2px solid var(--gold); border-radius:12px; padding:10px;">
        <iframe src="${escapeHtml(href)}" title="${escapeHtml(product.title)}" style="width:100%; min-height:640px; border:0; border-radius:8px; background:#fff;"></iframe>
      </div>`;
  }

  return `
    <div id="${escapeHtml(mediaId)}" style="margin-top:28px; background:rgba(36,28,16,0.7); border:2px solid var(--gold); border-radius:12px; padding:18px;">
      <a class="btn btn-primary btn-block" href="${escapeHtml(href)}" target="_blank" rel="noopener">Open media</a>
    </div>`;
}
function playProductMedia(button){
  const media = document.getElementById(button.dataset.mediaId);
  if(!media) return;
  media.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const player = media.querySelector('audio, video');
  if(player){ player.play().catch(() => {}); }
  else if(media.dataset.openUrl && window.matchMedia('(max-width: 700px)').matches){
    window.open(media.dataset.openUrl, '_blank', 'noopener,noreferrer');
  }
}

function productView(id){
  const p = products.find(x => x.id === id);
  if(!p){
    return `${navBar()}<section class="wrap" style="padding-top:60px;"><div class="empty-state">This item doesn't exist (or hasn't loaded yet).</div></section>${footerBar()}`;
  }
  if(isUpcomingProduct(p)){
    return `${navBar()}<section class="wrap prod-hero page-enter"><div><div class="creator-chip"><div class="avatar"><img src="${AUTHOR_PHOTO}" alt="${escapeHtml(p.creatorName)}"></div><span style="font-weight:600;">${escapeHtml(p.creatorName)}</span></div><span class="coming-label">Coming soon · ${escapeHtml(p.type)}</span><h1 style="font-size:32px;margin:14px 0;">${escapeHtml(p.title)}</h1><p style="font-size:16px;color:#D8D0C0;max-width:520px;">${escapeHtml(p.description) || 'This work is still taking shape.'}</p></div><div class="buy-box"><div class="big-price">Coming soon</div><div class="curr-note">This work is currently in progress.</div><div class="alert alert-info">Check back soon for the release.</div></div></section>${footerBar()}`;
  }
  return `
  ${navBar()}
  <section class="wrap prod-hero page-enter">
    <div>
      ${p.type === 'Book' ? (p.coverImage ? `<img class="product-cover-large" src="${escapeHtml(resolveLocalAssetUrl(p.coverImage))}" alt="Cover of ${escapeHtml(p.title)}">` : `<div class="feature-cover" style="margin-bottom:24px;">${escapeHtml(p.title)}</div>`) : ''}
      <div class="creator-chip"><div class="avatar"><img src="${AUTHOR_PHOTO}" alt="${escapeHtml(p.creatorName)}"></div><span style="font-weight:600;">${escapeHtml(p.creatorName)}</span></div>
      <span class="prod-type">${TYPE_ICON[p.type]||''} ${escapeHtml(p.type)}</span>
      <h1 style="font-size:32px;margin:14px 0 14px;">${escapeHtml(p.title)}</h1>
      <p style="font-size:16px;color:#D8D0C0;max-width:520px;">${escapeHtml(p.description) || "No description yet."}</p>
      ${productMediaEmbed(p)}
    </div>
    <div class="buy-box">
      <div class="big-price">${isFreeProduct(p) ? 'Free' : money(p.price, p.currency)}</div>
      <div class="curr-note">${isFreeProduct(p) ? 'Open access · enjoy it freely' : 'One-time payment · instant delivery'}</div>
      ${isFreeProduct(p)
        ? (p.fileLink ? `<button class="btn btn-primary btn-block" type="button" data-media-id="product-media-${escapeHtml(p.id)}" onclick="playProductMedia(this)">${freeActionLabel(p.type)}</button>` : `<div class="alert alert-info">This free piece is being prepared. Check back soon.</div>`)
        : `<button class="btn btn-primary btn-block" onclick="openCheckout('${p.id}')">Buy now</button>`}
      <ul class="delivers-list">
        <li>${ICON.check} ${isFreeProduct(p) ? 'Free access for every reader' : 'Delivered as a direct link right after payment'}</li>
        <li>${ICON.check} ${isFreeProduct(p) ? 'Read, listen, or watch at your pace' : 'Pay with mobile money or card'}</li>
        <li>${ICON.check} A note from Chanda if anything's wrong</li>
      </ul>
    </div>
  </section>
  ${footerBar()}
  ${checkoutState ? checkoutModal() : ''}
  `;
}
function openCheckout(id){
  const product = products.find(x=>x.id===id);
  if(!product || isFreeProduct(product)) return;
  checkoutState = { product, stage: 'select', network: null, error: null }; render();
}
function closeCheckout(){ checkoutState = null; render(); }
function selectNetwork(n){ checkoutState.network = n; render(); }
function payNow(){
  const phone = document.getElementById('co-phone').value.trim();
  if(!checkoutState.network){ alert('Choose a payment method.'); return; }
  if(!phone){ alert('Enter the phone number to charge.'); return; }
  checkoutState.stage = 'paying'; render();
  setTimeout(()=>{ checkoutState.stage = 'done'; render(); }, 1400);
}
async function payNowLive(){
  const email = document.getElementById('co-email').value.trim();
  if(!email || !email.includes('@')){ alert('Enter a valid email.'); return; }
  checkoutState.stage = 'paying'; checkoutState.error = null; render();
  try{
    const data = await apiCall('/payments/initiate', 'POST', { productId: checkoutState.product.id, email });
    window.location.href = data.paymentLink; // Flutterwave hosted checkout
  } catch(err){
    checkoutState.stage = 'select'; checkoutState.error = err.message; render();
  }
}
function checkoutModal(){
  const p = checkoutState.product;
  let inner = '';
  if(isLive()){
    if(checkoutState.stage === 'select'){
      inner = `
        <h3>Pay ${money(p.price,p.currency)}</h3>
        <p style="font-size:13.5px;color:#9C917F;margin:0 0 18px;">for "${escapeHtml(p.title)}"</p>
        ${checkoutState.error ? `<div class="alert" style="background:#F5D6CC;">${escapeHtml(checkoutState.error)}</div>` : ''}
        <div class="field"><label>Email <span class="hint">Your download link goes here too</span></label><input id="co-email" type="email" placeholder="you@example.com"></div>
        <button class="btn btn-primary btn-block" onclick="payNowLive()">Continue to secure payment</button>
        <p style="font-size:11.5px;color:#8C8272;margin-top:12px;">You'll choose mobile money or card on the next screen.</p>`;
    } else {
      inner = `<div style="text-align:center;padding:20px 0;"><span class="spinner"></span><h3 style="display:inline;">Redirecting to payment…</h3></div>`;
    }
    return `<div class="modal-backdrop" onclick="if(event.target===this && checkoutState.stage!=='paying') closeCheckout()"><div class="modal">${inner}</div></div>`;
  }
  if(checkoutState.stage === 'select'){
    inner = `
      <h3>Pay ${money(p.price,p.currency)}</h3>
      <p style="font-size:13.5px;color:#9C917F;margin:0 0 18px;">for "${escapeHtml(p.title)}"</p>
      <div class="net-options">${NETWORKS.map(n => `<button type="button" class="net-opt ${checkoutState.network===n?'selected':''}" onclick="selectNetwork('${n}')">${n}</button>`).join("")}</div>
      <div class="field"><label>Phone number</label><input id="co-phone" placeholder="e.g. 097 000 0000"></div>
      <button class="btn btn-primary btn-block" onclick="payNow()">Confirm payment</button>
      <p style="font-size:11.5px;color:#8C8272;margin-top:12px;">Demo checkout — no real charge is made.</p>`;
  } else if(checkoutState.stage === 'paying'){
    inner = `<div style="text-align:center;padding:20px 0;"><h3>Confirming payment…</h3><p style="color:#9C917F;font-size:14px;">Approve the prompt on your phone.</p></div>`;
  } else {
    inner = `<div style="text-align:center;">
        <div class="success-icon">${ICON.success}</div>
        <h3>Payment received</h3>
        <p style="color:#9C917F;font-size:14px;margin-bottom:18px;">Here's your link — a copy has also been sent to your email.</p>
        ${p.fileLink ? `<a class="btn btn-dark btn-block" href="${escapeHtml(resolveLocalAssetUrl(p.fileLink))}" target="_blank" rel="noopener">Open now</a>`
          : `<div class="alert alert-info">No file link is attached to this item yet — reach out directly.</div>`}
      </div>`;
  }
  return `<div class="modal-backdrop" onclick="if(event.target===this) closeCheckout()"><div class="modal">${inner}</div></div>`;
}

/* ---------- ABOUT ---------- */
function aboutView(){
  return `
  ${navBar()}
  <section class="wrap about-grid page-enter" style="padding-top:52px;">
    <div class="about-avatar"><img src="${AUTHOR_PHOTO}" alt="${escapeHtml(profile.name)}"></div>
    <div class="about-body">
      <h1 style="font-size:28px;">${escapeHtml(profile.name)}</h1>
      <p style="margin-top:12px; font-size:15px; color:#D9A94A; letter-spacing:0.08em; text-transform:uppercase; font-weight:700;">Poet • Writer • Voice for deeper reflection</p>
      <div style="margin-top:16px;">${profile.bio.map(para => `<p>${escapeHtml(para)}</p>`).join("")}</div>
      <div class="social-row">
        <a href="mailto:${escapeHtml(profile.email)}">✉ ${escapeHtml(profile.email)}</a>
        ${profile.instagram ? `<a href="https://instagram.com/${escapeHtml(profile.instagram.replace('@',''))}" target="_blank" rel="noopener">📷 ${escapeHtml(profile.instagram)}</a>` : ''}
        ${profile.facebook ? `<a href="${escapeHtml(profile.facebook)}" target="_blank" rel="noopener">👍 Facebook</a>` : ''}
        ${profile.youtube ? `<a href="${escapeHtml(profile.youtube)}" target="_blank" rel="noopener">▶ YouTube</a>` : ''}
        ${profile.twitter ? `<a href="#">𝕏 ${escapeHtml(profile.twitter)}</a>` : ''}
      </div>
    </div>
  </section>
  ${footerBar()}
  `;
}

/* ---------- render / init ---------- */
function render(){
  const route = currentRoute();
  let html = '';
  if(route === '/') html = homeView();
  else if(route === '/dashboard') html = dashboardView();
  else if(route === '/about') html = aboutView();
  else if(route === '/privacy') html = privacyView();
  else if(route === '/terms') html = termsView();
  else if(route === '/refunds') html = refundsView();
  else if(route.startsWith('/product/')) html = productView(route.split('/product/')[1]);
  else html = homeView();
  document.getElementById('app').innerHTML = html + chatWidget();
  if(chatOpen){
    const log = document.getElementById('chat-log');
    if(log) log.scrollTop = log.scrollHeight;
  }
  initScrollReveal();
}

/* ---------- animation helpers ---------- */
const revealObserver = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }) : null;

function initScrollReveal(){
  const els = document.querySelectorAll('.reveal:not(.visible)');
  els.forEach(el => {
    if(!revealObserver){ el.classList.add('visible'); return; }
    // reveal immediately if already in view on load
    const rect = el.getBoundingClientRect();
    if(rect.top < window.innerHeight * 0.92){ el.classList.add('visible'); }
    else { revealObserver.observe(el); }
  });
}

window.addEventListener('scroll', () => {
  const nav = document.querySelector('.nav');
  if(nav) nav.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });


async function init(){
  await registerVisitor();
  profile = await storeGet('profile', true);
  if(!profile){ profile = DEFAULT_PROFILE; await storeSet('profile', profile, true); }
  else if(!profile.dashboardPin){ profile.dashboardPin = "1234"; await storeSet('profile', profile, true); }

  if(isLive()){
    try{
      const liveProducts = await apiCall('/products', 'GET');
      const locallySavedProducts = await storeGet('products', true);
      products = normalizeProducts(liveProducts);
      if(Array.isArray(locallySavedProducts)){
        const localById = new Map(locallySavedProducts.filter(item => item && item.id).map(item => [String(item.id), item]));
        products = products.map(product => {
          const local = localById.get(String(product.id));
          if(!local) return product;
          return {
            ...product,
            fileLink: product.fileLink || local.fileLink || null,
            coverImage: product.coverImage || local.coverImage || null,
            galleryImages: Array.isArray(product.galleryImages) && product.galleryImages.length
              ? product.galleryImages
              : (Array.isArray(local.galleryImages) ? local.galleryImages : [])
          };
        });
      }
    } catch(err){
      products = normalizeProducts(DEFAULT_PRODUCTS);
    }
    authToken = await storeGet('auth-token', false);
    dashUnlocked = !!authToken;
    if(authToken){
      try{ subscribers = await apiCall('/subscribers', 'GET', null, authToken); }
      catch(err){ subscribers = []; }
      await loadVisitorStats();
    }
  } else {
    let p = await storeGet('products', true);
    if(!p){ p = normalizeProducts(DEFAULT_PRODUCTS); await storeSet('products', p, true); }
    else {
      p = normalizeProducts(p);
      await storeSet('products', p, true);
    }
    products = p;
    const unlocked = await storeGet('dash-unlocked', false);
    dashUnlocked = !!unlocked;
  }

  if(!isLive()){
    const subs = await storeGet('subscribers', true);
    subscribers = subs || [];
  }
  render();
}
init();
</script>
